<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#030307" />
    <meta name="color-scheme" content="dark" />

    <!--
      Fonts are preconnected and loaded here rather than via @import in
      CSS. An @import inside the stylesheet creates a request chain
      (HTML → CSS → font CSS → font file) that delays first paint.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />

    <!--
      Per-route <title>, description, canonical, Open Graph and Twitter
      tags are rendered by src/components/Seo.jsx (React 19 hoists them
      into <head>). The fallbacks below only matter before hydration and
      for crawlers that do not execute JavaScript.
    -->
    <title>Tanvo Tech | Web, App, AI &amp; Digital Solutions Agency</title>
    <meta
      name="description"
      content="Tanvo Tech builds high-performance MERN web applications, cross-platform mobile apps, custom AI integrations, and business process automation."
    />
    <meta name="author" content="Tanvo Tech" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem 1.5rem; text-align: center; color: #94a3b8; font-family: system-ui, sans-serif;">
        <h1 style="color: #fff; font-size: 1.5rem; margin-bottom: 0.75rem;">Tanvo Tech</h1>
        <p style="margin-bottom: 1rem;">
          This site needs JavaScript enabled. Please turn it on, or email us directly.
        </p>
        <a href="mailto:hello@tanvo.tech" style="color: #00f2fe;">hello@tanvo.tech</a>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
